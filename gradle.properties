# LM-Reader — Gradle 全局配置

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Android
# AGP 9 自带内置 Kotlin 支持，其新 DSL 与 org.jetbrains.kotlin.android 不兼容。
# 本项目需要 Compose 编译器插件、KSP(Room) 与 kotlinx-serialization 三个 Kotlin
# 编译器插件，官方接入方式仍以 Kotlin Gradle Plugin 为准，因此显式退回经典路径。
# 迁移到内置 Kotlin 见 https://developer.android.com/build/migrate-to-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
# LiteRT 2.2.0 的官方 litert 与 litert-api AAR 共用 namespace；AGP 9 默认将它视为错误。
# 两者是互补的运行库/API，不能排除 litert-api；本项目自己的模块仍保持独立 namespace。
android.uniquePackageNames=false

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m

# 依赖版本以 gradle/libs.versions.toml 为唯一来源。
